<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여우방 맞팔확인</title>
<meta name="description" content="여우방 맞팔확인">
<link rel="canonical" href="https://dustns09060-eng.github.io/yeowoobang-new/">
<meta name="theme-color" content="#fff7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여우방 맞팔확인">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="여우방 맞팔확인">
<meta property="og:title" content="여우방 맞팔확인">
<meta property="og:description" content="여우방 맞팔확인">
<meta property="og:url" content="https://dustns09060-eng.github.io/yeowoobang-new/">
<meta property="og:image" content="https://dustns09060-eng.github.io/yeowoobang-new/kakao-preview.png">
<meta property="og:image:secure_url" content="https://dustns09060-eng.github.io/yeowoobang-new/kakao-preview.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="여우방 맞팔확인">
<meta name="twitter:image" content="https://dustns09060-eng.github.io/yeowoobang-new/kakao-preview.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="loginScreen" class="login-screen">
 <div class="login-card">
  <img src="app-icon-192.png" class="login-logo" alt="여우방">
  <h1>여우방</h1><h2>맞팔확인</h2>
  <p>입장 비밀번호를 입력해주세요.</p>
  <input id="entryPw" type="password" placeholder="입장 비밀번호" autocomplete="current-password">
  <button id="entryBtn" class="primary">입장하기</button>
  <p id="entryMsg" class="error"></p>
 </div>
</section>

<div id="app" class="hidden">
 <header>
  <div class="brand"><img src="app-icon-192.png"><b>여우방 맞팔확인</b></div>
  <div class="header-actions"><button id="adminBtn">⚙️ 운영진모드</button><button id="moreBtn">⋯</button></div>
 </header>
 <main>
  <section class="card hero">
   <div class="row"><div><h2>맞팔분석</h2><p id="periodText">맞팔확인 기간을 확인 중입니다.</p></div><span id="periodBadge" class="badge">확인중</span></div>
  </section>

  <section id="analysisCard" class="card">
   <h3>🔎 맞팔분석</h3>
   <p id="analysisGuide" class="muted">맞팔확인 기간 중에만 사용할 수 있어요.</p>
   <div class="file-box"><input id="zipInput" type="file" accept=".zip" disabled></div>
   <button id="analyzeBtn" class="primary" disabled>맞팔 분석 시작</button>
   <p id="analysisStatus" class="muted"></p>
  </section>

  <section id="summarySection" class="card hidden">
   <h3>분석 결과</h3>
   <div class="summary-grid">
    <button data-result-tab="all"><b id="allCount">0</b><span>전체</span></button>
    <button data-result-tab="mutual"><b id="mutualCount">0</b><span>맞팔</span></button>
    <button data-result-tab="onlyMe"><b id="onlyMeCount">0</b><span>나만 팔로우</span></button>
    <button data-result-tab="fansOnly"><b id="fansOnlyCount">0</b><span>상대만 팔로우</span></button>
    <button data-result-tab="neither"><b id="neitherCount">0</b><span>서로 미팔로우</span></button>
   </div>
   <div class="result-tools">
    <input id="resultSearch" placeholder="닉네임 · 인스타 아이디 검색">
    <button id="copyResultBtn">현재 결과 복사</button>
   </div>
   <div id="resultList"></div>
  </section>

  <section class="card notice-card">
   <h3>📢 공지</h3>
   <pre id="noticeContent">등록된 공지가 없습니다.</pre>
  </section>
 </main>
</div>

<div id="moreMenu" class="overlay hidden"><div class="sheet"><button id="installBtn">📱 앱 설치</button><button id="logoutBtn">로그아웃</button><button data-close="moreMenu">닫기</button></div></div>

<div id="adminAuth" class="overlay hidden">
 <div class="sheet">
  <div class="row"><h3>⚙️ 운영진모드</h3><button data-close="adminAuth">✕</button></div>
<input id="adminPw" type="password" placeholder="운영진 비밀번호">
  <button id="adminLoginBtn" class="primary">운영진모드 열기</button>
  <p id="adminMsg" class="error"></p>
 </div>
</div>

<div id="adminPanel" class="overlay hidden">
 <div class="sheet large">
  <div class="row"><div><small id="adminRole"></small><h3>⚙️ 운영진모드</h3></div><button data-close="adminPanel">✕</button></div>

  <div class="admin-block">
   <h4>맞팔확인 기간</h4>
   <div class="two-col"><input id="periodStart" type="datetime-local"><input id="periodEnd" type="datetime-local"></div>
   <button id="savePeriodBtn" class="primary">기간 저장</button>
  </div>

  <div class="admin-block">
   <h4>📢 공지 관리</h4>
   <input id="noticeTitle" placeholder="공지 제목">
   <textarea id="noticeBody" rows="5" placeholder="공지 내용을 입력해주세요."></textarea>
   <button id="saveNoticeBtn" class="primary">공지 저장</button>
  </div>

  <div class="admin-block">
   <h4>🔐 입장 비밀번호 변경</h4>
   <p class="muted">운영진 비밀번호로 인증한 운영진이라면 변경할 수 있어요.</p>
   <input id="currentEntryPw" type="password" placeholder="현재 입장 비밀번호">
   <input id="newEntryPw" type="password" placeholder="새 입장 비밀번호 (4자 이상)">
   <input id="confirmEntryPw" type="password" placeholder="새 입장 비밀번호 확인">
   <button id="changeEntryPwBtn" class="primary">입장 비밀번호 변경</button>
  </div>
 </div>
</div>

<div id="toast" class="toast hidden"></div>
<script>window.APP_CONFIG={apiUrl:"https://script.google.com/macros/s/AKfycbxXmIenXX9fIP_MhmSWdvLRUQrOV2klX1HpUWnYgnCmbbw5f3beUh0OWuLf16TBcowb/exec"}</script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
</body>
</html>
